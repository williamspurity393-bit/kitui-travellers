<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#04040e"/>
      <stop offset="30%" stop-color="#0a0a28"/>
      <stop offset="60%" stop-color="#1a1260"/>
      <stop offset="85%" stop-color="#3a1a90"/>
      <stop offset="100%" stop-color="#6030c0"/>
    </linearGradient>
    <linearGradient id="cliff1" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0%" stop-color="#4a3880"/>
      <stop offset="40%" stop-color="#2d2060"/>
      <stop offset="100%" stop-color="#100a28"/>
    </linearGradient>
    <linearGradient id="cliff2" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#382870"/>
      <stop offset="100%" stop-color="#0c0820"/>
    </linearGradient>
    <linearGradient id="cliff3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5040a0"/>
      <stop offset="60%" stop-color="#2a1e68"/>
      <stop offset="100%" stop-color="#0e0a24"/>
    </linearGradient>
    <linearGradient id="plain" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e1840"/>
      <stop offset="100%" stop-color="#0c0a20"/>
    </linearGradient>
    <radialGradient id="nebula" cx="30%" cy="25%" r="40%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.2"/>
      <stop offset="60%" stop-color="#4f46e5" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <radialGradient id="nebula2" cx="75%" cy="20%" r="30%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <filter id="rock-texture">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="4"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.2  0 0 0 0 0.15  0 0 0 0 0.4  0 0 0 0.15 0"/>
      <feBlend in="SourceGraphic" mode="overlay"/>
    </filter>
  </defs>

  <!-- Sky -->
  <rect width="800" height="500" fill="url(#sky)"/>

  <!-- Nebula / Milky Way band -->
  <ellipse cx="240" cy="130" rx="320" ry="120" fill="url(#nebula)"/>
  <ellipse cx="600" cy="100" rx="240" ry="100" fill="url(#nebula2)"/>

  <!-- Stars — dense field -->
  <circle cx="40" cy="25" r="1.3" fill="white" opacity="0.9"/>
  <circle cx="95" cy="50" r="0.8" fill="white" opacity="0.7"/>
  <circle cx="150" cy="20" r="1.1" fill="white" opacity="0.8"/>
  <circle cx="210" cy="45" r="0.9" fill="white" opacity="0.6"/>
  <circle cx="270" cy="15" r="1.4" fill="white" opacity="0.9"/>
  <circle cx="330" cy="38" r="0.8" fill="white" opacity="0.7"/>
  <circle cx="390" cy="22" r="1.2" fill="white" opacity="0.8"/>
  <circle cx="450" cy="50" r="0.9" fill="white" opacity="0.6"/>
  <circle cx="510" cy="18" r="1.1" fill="white" opacity="0.8"/>
  <circle cx="570" cy="42" r="0.8" fill="white" opacity="0.7"/>
  <circle cx="630" cy="25" r="1.3" fill="white" opacity="0.9"/>
  <circle cx="695" cy="48" r="0.9" fill="white" opacity="0.6"/>
  <circle cx="755" cy="22" r="1.1" fill="white" opacity="0.8"/>
  <!-- Extra small stars -->
  <circle cx="75" cy="80" r="0.6" fill="white" opacity="0.5"/>
  <circle cx="185" cy="70" r="0.7" fill="white" opacity="0.6"/>
  <circle cx="305" cy="85" r="0.6" fill="white" opacity="0.5"/>
  <circle cx="425" cy="75" r="0.7" fill="white" opacity="0.6"/>
  <circle cx="545" cy="88" r="0.6" fill="white" opacity="0.5"/>
  <circle cx="665" cy="72" r="0.7" fill="white" opacity="0.6"/>
  <circle cx="115" cy="110" r="0.8" fill="#818cf8" opacity="0.6"/>
  <circle cx="480" cy="105" r="0.9" fill="#c084fc" opacity="0.7"/>
  <circle cx="730" cy="95" r="0.7" fill="#818cf8" opacity="0.5"/>

  <!-- Vast plain in distance -->
  <path d="M0 345 Q400 330 800 342 L800 380 L0 380Z" fill="url(#plain)" opacity="0.8"/>

  <!-- CLIFFS - main escarpment -->
  <!-- Far cliff left -->
  <path d="M0 430 Q5 340 30 300 Q60 268 100 258 Q140 252 165 265 Q190 278 200 310 Q210 345 205 400 Q195 430 180 438 L0 438Z" fill="url(#cliff2)" opacity="0.85"/>

  <!-- Main cliff face - dramatic vertical -->
  <path d="M160 438 Q168 350 185 295 Q210 250 255 228 Q295 218 330 225 Q375 235 400 262 Q430 295 440 340 Q448 380 445 430 L160 430Z" fill="url(#cliff1)"/>

  <!-- Cliff highlight - moonlit left face -->
  <path d="M255 228 Q295 218 330 225 Q375 235 400 262 Q380 250 358 248 Q335 245 315 252 Q290 260 278 278 Q262 300 258 330 Q254 360 260 400 L232 400 Q218 360 220 320 Q225 278 255 228Z" fill="#6050a0" opacity="0.3"/>

  <!-- Cliff shadow right side -->
  <path d="M400 262 Q430 295 440 340 Q448 380 445 430 L400 430 Q415 400 418 365 Q418 330 408 298 Q400 278 390 265Z" fill="#0c0820" opacity="0.6"/>

  <!-- Center-right cliff mass -->
  <path d="M420 438 Q428 360 445 318 Q468 275 510 258 Q548 245 580 255 Q615 268 635 298 Q652 328 648 380 Q645 415 640 438 L420 438Z" fill="url(#cliff3)" opacity="0.9"/>

  <!-- Far right cliff -->
  <path d="M630 438 Q636 372 658 338 Q680 305 715 298 Q745 295 765 315 Q785 338 790 378 Q795 410 800 438 L630 438Z" fill="url(#cliff2)" opacity="0.85"/>

  <!-- Rock face details - vertical cracks -->
  <path d="M270 228 Q265 280 262 340 Q260 390 263 430" stroke="#0c0820" stroke-width="2.5" fill="none" opacity="0.5"/>
  <path d="M320 230 Q314 285 310 348 Q308 392 312 432" stroke="#0c0820" stroke-width="2" fill="none" opacity="0.4"/>
  <path d="M370 248 Q363 300 358 360 Q355 400 360 432" stroke="#0c0820" stroke-width="2" fill="none" opacity="0.35"/>

  <!-- Rock ledges (horizontal strata) -->
  <path d="M183 312 Q280 298 395 308 Q415 312 432 320" stroke="#5040a0" stroke-width="2" fill="none" opacity="0.4"/>
  <path d="M175 350 Q280 335 400 346 Q422 350 440 360" stroke="#5040a0" stroke-width="1.5" fill="none" opacity="0.35"/>
  <path d="M168 388 Q280 372 415 384 Q435 388 445 396" stroke="#3a2878" stroke-width="1.5" fill="none" opacity="0.3"/>

  <!-- Dry-country flora on ledges -->
  <!-- Succulent/aloe on ledge 1 -->
  <g transform="translate(218, 312)" fill="#2d5020" opacity="0.85">
    <path d="M0 0 Q5 -18 10 -5 Q15 -22 20 -8 Q25 -20 30 -6 Q22 0 15 -2 Q8 -2 0 0Z"/>
  </g>
  <!-- Aloe right cliff -->
  <g transform="translate(470, 298)" fill="#2d5020" opacity="0.8">
    <path d="M0 0 Q4 -15 8 -4 Q12 -18 16 -6 Q20 -16 24 -5 Q18 0 12 -2 Q6 -1 0 0Z"/>
  </g>

  <!-- Indigo-coloured lichen patches on rock -->
  <ellipse cx="295" cy="340" rx="22" ry="8" fill="#818cf8" opacity="0.12"/>
  <ellipse cx="340" cy="360" rx="16" ry="6" fill="#818cf8" opacity="0.1"/>
  <ellipse cx="500" cy="328" rx="18" ry="7" fill="#818cf8" opacity="0.12"/>

  <!-- Ground in foreground -->
  <path d="M0 450 Q400 435 800 448 L800 500 L0 500Z" fill="#0c0820"/>

  <!-- Dry scrub in foreground -->
  <path d="M50 465 L46 445 M58 467 L62 442 M70 465 L66 447" stroke="#2d2060" stroke-width="2.5" opacity="0.7"/>
  <path d="M700 462 L696 442 M710 465 L714 440 M722 462 L718 444" stroke="#2d2060" stroke-width="2.5" opacity="0.7"/>
  <path d="M360 460 L356 442 M368 462 L372 440 M380 460 L376 444" stroke="#2d2060" stroke-width="2" opacity="0.6"/>

  <!-- Purple atmospheric overlay -->
  <rect width="800" height="500" fill="#818cf8" opacity="0.025"/>
</svg>