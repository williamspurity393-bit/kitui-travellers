<svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a2540"/>
      <stop offset="100%" stop-color="#0b1120"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
  </defs>
  <!-- Background rounded square -->
  <rect width="32" height="32" rx="7" fill="url(#bg)"/>
  <!-- Bus body -->
  <rect x="4" y="12" width="24" height="13" rx="2.5" fill="url(#orange)"/>
  <!-- Bus roof -->
  <rect x="6" y="9" width="20" height="5" rx="2" fill="url(#orange)"/>
  <!-- Windows -->
  <rect x="8" y="13.5" width="5" height="4" rx="1" fill="#0b1120" opacity="0.9"/>
  <rect x="15.5" y="13.5" width="5" height="4" rx="1" fill="#0b1120" opacity="0.9"/>
  <!-- Windshield -->
  <rect x="7" y="10" width="7" height="4" rx="1" fill="#0b1120" opacity="0.6"/>
  <!-- Front grill -->
  <rect x="4" y="20" width="4" height="2" rx="1" fill="#0b1120" opacity="0.4"/>
  <!-- Wheels -->
  <circle cx="10" cy="26" r="3" fill="#1a2540"/>
  <circle cx="10" cy="26" r="1.5" fill="#fb923c" opacity="0.7"/>
  <circle cx="22" cy="26" r="3" fill="#1a2540"/>
  <circle cx="22" cy="26" r="1.5" fill="#fb923c" opacity="0.7"/>
  <!-- Road line -->
  <line x1="0" y1="29.5" x2="32" y2="29.5" stroke="#f97316" stroke-width="0.6" opacity="0.3"/>
</svg>