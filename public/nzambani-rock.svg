<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="35%" stop-color="#1a2040"/>
      <stop offset="70%" stop-color="#c04a10"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <linearGradient id="rock-main" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#8b5a2b"/>
      <stop offset="40%" stop-color="#6b3d15"/>
      <stop offset="100%" stop-color="#2d1608"/>
    </linearGradient>
    <linearGradient id="rock-shadow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a0a04"/>
      <stop offset="100%" stop-color="#0d0602"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3d2008"/>
      <stop offset="100%" stop-color="#1a0e04"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#f97316" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur-sm">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
    <filter id="blur-md">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <filter id="noise">
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feBlend in="SourceGraphic" mode="multiply" result="blend"/>
      <feComposite in="blend" in2="SourceGraphic" operator="in"/>
    </filter>
    <clipPath id="clip">
      <rect width="800" height="500"/>
    </clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <!-- Sky -->
    <rect width="800" height="500" fill="url(#sky)"/>
    <!-- Horizon glow -->
    <ellipse cx="400" cy="340" rx="350" ry="120" fill="url(#glow)"/>
    <!-- Stars -->
    <circle cx="120" cy="40" r="1.2" fill="white" opacity="0.8"/>
    <circle cx="200" cy="80" r="0.8" fill="white" opacity="0.6"/>
    <circle cx="340" cy="30" r="1" fill="white" opacity="0.7"/>
    <circle cx="500" cy="55" r="1.4" fill="white" opacity="0.9"/>
    <circle cx="620" cy="25" r="0.9" fill="white" opacity="0.6"/>
    <circle cx="700" cy="70" r="1.1" fill="white" opacity="0.7"/>
    <circle cx="760" cy="45" r="0.7" fill="white" opacity="0.5"/>
    <circle cx="80" cy="100" r="0.8" fill="white" opacity="0.5"/>
    <circle cx="450" cy="15" r="1" fill="white" opacity="0.8"/>
    <!-- Distant hills -->
    <path d="M0 340 Q100 280 200 310 Q300 270 400 300 Q500 265 600 295 Q700 270 800 295 L800 500 L0 500Z" fill="#1a0e04" opacity="0.7"/>
    <!-- Ground plane -->
    <path d="M0 380 Q200 360 400 370 Q600 360 800 375 L800 500 L0 500Z" fill="url(#ground)"/>
    <!-- Main rock - the great boulder -->
    <path d="M290 380 Q295 300 320 240 Q350 180 400 155 Q440 140 460 165 Q500 190 515 240 Q530 290 520 350 Q510 380 500 390 L290 390Z" fill="url(#rock-main)"/>
    <!-- Rock highlight face -->
    <path d="M310 370 Q315 295 338 240 Q360 185 395 162 Q430 148 452 168 Q400 155 380 185 Q355 215 345 270 Q338 320 340 375Z" fill="#b87840" opacity="0.4"/>
    <!-- Rock shadow side -->
    <path d="M460 165 Q500 190 515 240 Q530 290 520 350 Q510 385 500 390 L450 390 Q470 360 475 320 Q478 280 470 240 Q462 200 450 175Z" fill="url(#rock-shadow)" opacity="0.6"/>
    <!-- Rock detail cracks -->
    <path d="M370 200 Q375 230 368 260 Q362 290 365 320" stroke="#2d1608" stroke-width="1.5" fill="none" opacity="0.6"/>
    <path d="M420 175 Q425 210 418 245 Q412 275 415 310" stroke="#2d1608" stroke-width="1" fill="none" opacity="0.5"/>
    <!-- Boulder at base left -->
    <path d="M220 385 Q235 355 265 350 Q295 348 300 375 Q295 390 265 392 Q240 392 220 385Z" fill="#5c3010" opacity="0.8"/>
    <!-- Boulder at base right -->
    <path d="M510 380 Q525 355 555 352 Q580 350 585 372 Q580 390 555 392 Q530 393 510 380Z" fill="#5c3010" opacity="0.7"/>
    <!-- Acacia tree left -->
    <rect x="140" y="340" width="4" height="50" fill="#2d1608" opacity="0.9"/>
    <path d="M130 340 Q142 310 155 320 Q165 305 178 315 Q188 295 198 310 Q208 300 215 315 Q205 325 195 320 Q185 335 175 325 Q165 340 155 330 Q145 345 130 340Z" fill="#1a3a10" opacity="0.85"/>
    <!-- Acacia tree right -->
    <rect x="636" y="350" width="3.5" height="44" fill="#2d1608" opacity="0.9"/>
    <path d="M626 350 Q637 322 648 332 Q657 318 668 328 Q677 310 686 324 Q693 315 698 328 Q689 338 680 333 Q670 346 660 337 Q650 350 640 342 Q630 354 626 350Z" fill="#1a3a10" opacity="0.8"/>
    <!-- Small acacia far left -->
    <rect x="60" y="360" width="2.5" height="30" fill="#2d1608" opacity="0.7"/>
    <path d="M52 360 Q61 340 70 348 Q77 334 86 344 Q91 336 97 345 Q90 354 82 349 Q74 360 66 352 Q58 363 52 360Z" fill="#152e0c" opacity="0.7"/>
    <!-- Ground texture marks -->
    <line x1="100" y1="392" x2="180" y2="390" stroke="#2d1608" stroke-width="1" opacity="0.4"/>
    <line x1="620" y1="388" x2="720" y2="386" stroke="#2d1608" stroke-width="1" opacity="0.4"/>
    <line x1="50" y1="405" x2="150" y2="403" stroke="#1a0e04" stroke-width="0.8" opacity="0.3"/>
    <!-- Metallic staircase hint on rock -->
    <line x1="398" y1="157" x2="395" y2="380" stroke="#c8944a" stroke-width="1.5" opacity="0.3"/>
    <path d="M390 250 L410 248 M388 270 L408 268 M386 290 L406 288 M384 310 L404 308" stroke="#c8944a" stroke-width="1" opacity="0.25"/>
    <!-- Atmospheric haze -->
    <rect width="800" height="500" fill="#f97316" opacity="0.04"/>
    <!-- Noise overlay -->
    <rect width="800" height="500" opacity="0.08" filter="url(#noise)"/>
  </g>
</svg>