<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="60%" stop-color="#0f1a30"/>
      <stop offset="100%" stop-color="#1a0a04"/>
    </linearGradient>
    <radialGradient id="glow1" cx="15%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <radialGradient id="glow2" cx="85%" cy="40%" r="40%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <pattern id="dots" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1" fill="#f97316" opacity="0.12"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#dots)"/>
  <rect width="1200" height="630" fill="url(#glow1)"/>
  <rect width="1200" height="630" fill="url(#glow2)"/>

  <!-- Left accent bar -->
  <rect x="0" y="0" width="8" height="630" fill="url(#orange)"/>

  <!-- Orange bottom accent line -->
  <rect x="8" y="610" width="1192" height="4" rx="2" fill="#f97316" opacity="0.5"/>

  <!-- Bus illustration (right side) -->
  <g transform="translate(720, 140) scale(1.4)">
    <!-- Bus body -->
    <rect x="0" y="60" width="310" height="160" rx="18" fill="#f97316" opacity="0.15"/>
    <rect x="0" y="60" width="310" height="160" rx="18" fill="none" stroke="#f97316" stroke-width="2" opacity="0.4"/>
    <!-- Roof -->
    <rect x="20" y="36" width="270" height="30" rx="10" fill="#f97316" opacity="0.12"/>
    <rect x="20" y="36" width="270" height="30" rx="10" fill="none" stroke="#f97316" stroke-width="1.5" opacity="0.3"/>
    <!-- Windows -->
    <rect x="30" y="44" width="60" height="22" rx="5" fill="#f97316" opacity="0.2"/>
    <rect x="105" y="44" width="60" height="22" rx="5" fill="#f97316" opacity="0.2"/>
    <rect x="180" y="44" width="60" height="22" rx="5" fill="#f97316" opacity="0.2"/>
    <rect x="30" y="78" width="70" height="50" rx="8" fill="#f97316" opacity="0.18"/>
    <rect x="115" y="78" width="70" height="50" rx="8" fill="#f97316" opacity="0.18"/>
    <rect x="200" y="78" width="70" height="50" rx="8" fill="#f97316" opacity="0.18"/>
    <!-- Wheels -->
    <circle cx="70" cy="230" r="38" fill="none" stroke="#f97316" stroke-width="3" opacity="0.4"/>
    <circle cx="70" cy="230" r="22" fill="none" stroke="#f97316" stroke-width="2" opacity="0.3"/>
    <circle cx="240" cy="230" r="38" fill="none" stroke="#f97316" stroke-width="3" opacity="0.4"/>
    <circle cx="240" cy="230" r="22" fill="none" stroke="#f97316" stroke-width="2" opacity="0.3"/>
    <!-- Road -->
    <line x1="-50" y1="268" x2="370" y2="268" stroke="#f97316" stroke-width="2" opacity="0.2"/>
    <line x1="-50" y1="278" x2="370" y2="278" stroke="#f97316" stroke-width="1" opacity="0.12"/>
    <!-- Speed lines -->
    <line x1="-40" y1="140" x2="-15" y2="140" stroke="#f97316" stroke-width="3" opacity="0.4"/>
    <line x1="-60" y1="155" x2="-20" y2="155" stroke="#f97316" stroke-width="2.5" opacity="0.3"/>
    <line x1="-50" y1="170" x2="-18" y2="170" stroke="#f97316" stroke-width="2" opacity="0.25"/>
  </g>

  <!-- Map pin decoration -->
  <g transform="translate(1080, 480)">
    <path d="M0 -30 Q12 -30 12 -18 Q12 0 0 20 Q-12 0 -12 -18 Q-12 -30 0 -30Z" fill="#f97316" opacity="0.6"/>
    <circle cx="0" cy="-18" r="7" fill="#0b1120" opacity="0.8"/>
  </g>
  <g transform="translate(660, 520)">
    <path d="M0 -22 Q9 -22 9 -13 Q9 0 0 15 Q-9 0 -9 -13 Q-9 -22 0 -22Z" fill="#60a5fa" opacity="0.4"/>
    <circle cx="0" cy="-13" r="5" fill="#0b1120" opacity="0.6"/>
  </g>

  <!-- KT Logo top left -->
  <rect x="60" y="55" width="60" height="60" rx="14" fill="#f97316"/>
  <text x="90" y="101" font-family="Arial Black, sans-serif" font-weight="900" font-size="32" fill="white" text-anchor="middle">KT</text>

  <!-- Main headline -->
  <text x="60" y="210" font-family="Arial Black, sans-serif" font-weight="900" font-size="72" fill="white" letter-spacing="-2">Kitui</text>
  <text x="60" y="292" font-family="Arial Black, sans-serif" font-weight="900" font-size="72" fill="#f97316" letter-spacing="-2">Travellers</text>

  <!-- Tagline -->
  <text x="60" y="360" font-family="Arial, sans-serif" font-weight="400" font-size="28" fill="white" opacity="0.65" letter-spacing="0.5">Book bus &amp; matatu tickets across</text>
  <text x="60" y="398" font-family="Arial, sans-serif" font-weight="400" font-size="28" fill="white" opacity="0.65" letter-spacing="0.5">Kitui &amp; Eastern Kenya</text>

  <!-- Tags row -->
  <rect x="60" y="440" width="130" height="38" rx="19" fill="#f97316" opacity="0.15" stroke="#f97316" stroke-width="1.5" stroke-opacity="0.4"/>
  <text x="125" y="464" font-family="Arial, sans-serif" font-size="16" fill="#f97316" text-anchor="middle" letter-spacing="1">M-PESA</text>

  <rect x="210" y="440" width="160" height="38" rx="19" fill="#f97316" opacity="0.1" stroke="#f97316" stroke-width="1.5" stroke-opacity="0.3"/>
  <text x="290" y="464" font-family="Arial, sans-serif" font-size="16" fill="#f97316" text-anchor="middle" letter-spacing="1">INSTANT QR</text>

  <rect x="390" y="440" width="170" height="38" rx="19" fill="#f97316" opacity="0.1" stroke="#f97316" stroke-width="1.5" stroke-opacity="0.3"/>
  <text x="475" y="464" font-family="Arial, sans-serif" font-size="16" fill="#f97316" text-anchor="middle" letter-spacing="1">LIVE SEATS</text>

  <!-- URL bottom -->
  <text x="60" y="580" font-family="Arial, sans-serif" font-size="20" fill="white" opacity="0.35" letter-spacing="2">kuittravellers.co.ke</text>

  <!-- Route hint -->
  <g opacity="0.35">
    <circle cx="900" cy="548" r="6" fill="#f97316"/>
    <line x1="906" y1="548" x2="950" y2="548" stroke="#f97316" stroke-width="1.5" stroke-dasharray="4 3"/>
    <circle cx="956" cy="548" r="6" fill="#60a5fa"/>
    <text x="915" y="544" font-family="Arial, sans-serif" font-size="13" fill="white" text-anchor="middle">Kitui</text>
    <text x="970" y="544" font-family="Arial, sans-serif" font-size="13" fill="white" text-anchor="middle">Nairobi</text>
  </g>
</svg>