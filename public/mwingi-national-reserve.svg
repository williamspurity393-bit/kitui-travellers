<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f1a0a"/>
      <stop offset="30%" stop-color="#1a3010"/>
      <stop offset="60%" stop-color="#b04510"/>
      <stop offset="85%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <radialGradient id="sun" cx="55%" cy="72%" r="18%">
      <stop offset="0%" stop-color="#fde68a" stop-opacity="1"/>
      <stop offset="30%" stop-color="#f97316" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#f97316" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2d4a10"/>
      <stop offset="100%" stop-color="#0f1a05"/>
    </linearGradient>
    <linearGradient id="eleph" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a2a0a"/>
      <stop offset="100%" stop-color="#0a1204"/>
    </linearGradient>
    <filter id="blur-horizon">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <!-- Sky -->
  <rect width="800" height="500" fill="url(#sky)"/>
  <!-- Sun glow -->
  <ellipse cx="440" cy="360" rx="200" ry="90" fill="#f97316" opacity="0.25" filter="url(#blur-horizon)"/>
  <circle cx="440" cy="355" r="45" fill="url(#sun)"/>
  <!-- Sun disc -->
  <circle cx="440" cy="355" r="22" fill="#fde68a" opacity="0.95"/>

  <!-- Distant hills / tree line -->
  <path d="M0 310 Q80 270 160 285 Q240 265 320 278 Q400 260 480 275 Q560 262 640 278 Q720 265 800 275 L800 330 L0 330Z" fill="#0f1a05" opacity="0.9"/>
  <!-- Acacia tree silhouettes far -->
  <rect x="90" y="270" width="3" height="45" fill="#0a1204"/>
  <ellipse cx="91" cy="265" rx="22" ry="12" fill="#0f1f05"/>
  <rect x="250" y="258" width="3.5" height="55" fill="#0a1204"/>
  <ellipse cx="252" cy="252" rx="28" ry="14" fill="#0f1f05"/>
  <rect x="560" y="265" width="3" height="48" fill="#0a1204"/>
  <ellipse cx="562" cy="260" rx="24" ry="12" fill="#0f1f05"/>
  <rect x="700" y="272" width="2.5" height="40" fill="#0a1204"/>
  <ellipse cx="701" cy="267" rx="20" ry="10" fill="#0f1f05"/>

  <!-- Ground -->
  <path d="M0 360 Q400 340 800 358 L800 500 L0 500Z" fill="url(#ground)"/>
  <!-- Ground grass texture -->
  <path d="M0 370 Q200 362 400 368 Q600 360 800 366" stroke="#34d399" stroke-width="0.5" fill="none" opacity="0.15"/>

  <!-- Water reflection pool -->
  <ellipse cx="430" cy="410" rx="120" ry="20" fill="#f97316" opacity="0.12"/>
  <ellipse cx="430" cy="412" rx="90" ry="12" fill="#fbbf24" opacity="0.08"/>

  <!-- Elephant 1 - large adult, center -->
  <g fill="url(#eleph)" opacity="0.95">
    <!-- Body -->
    <ellipse cx="400" cy="395" rx="75" ry="48"/>
    <!-- Head -->
    <ellipse cx="340" cy="375" rx="38" ry="35"/>
    <!-- Trunk -->
    <path d="M318 395 Q295 420 310 445 Q315 455 322 450 Q314 430 320 418 Q330 410 340 400" fill="#0f1a06"/>
    <!-- Ear -->
    <ellipse cx="322" cy="368" rx="25" ry="30" fill="#0d1804" opacity="0.8"/>
    <!-- Tusk -->
    <path d="M328 390 Q310 398 305 405 Q302 412 308 415" stroke="#e8d8a0" stroke-width="3" fill="none" opacity="0.7"/>
    <!-- Legs -->
    <rect x="355" y="430" width="18" height="42" rx="5" fill="#0a1204"/>
    <rect x="385" y="432" width="18" height="40" rx="5" fill="#0a1204"/>
    <rect x="418" y="428" width="18" height="44" rx="5" fill="#0a1204"/>
    <rect x="448" y="430" width="16" height="42" rx="5" fill="#0a1204"/>
    <!-- Tail -->
    <path d="M472 385 Q490 395 488 408" stroke="#0a1204" stroke-width="3" fill="none"/>
    <!-- Eye highlight -->
    <circle cx="330" cy="368" r="3" fill="#1a2a0a"/>
    <circle cx="329" cy="367" r="1.2" fill="#fde68a" opacity="0.4"/>
  </g>

  <!-- Elephant 2 - smaller, left -->
  <g fill="#0c1505" opacity="0.9">
    <ellipse cx="175" cy="408" rx="52" ry="34"/>
    <ellipse cx="132" cy="392" rx="27" ry="24"/>
    <path d="M118 405 Q100 424 112 442 Q116 448 121 444 Q115 428 120 418 Q128 410 135 402" fill="#0a1204"/>
    <ellipse cx="116" cy="386" rx="18" ry="22" fill="#0a1204" opacity="0.8"/>
    <rect x="148" y="432" width="13" height="34" rx="4" fill="#08100a"/>
    <rect x="170" y="434" width="13" height="32" rx="4" fill="#08100a"/>
    <rect x="193" y="431" width="13" height="35" rx="4" fill="#08100a"/>
    <rect x="213" y="433" width="12" height="33" rx="4" fill="#08100a"/>
  </g>

  <!-- Elephant 3 - calf, right -->
  <g fill="#0e1a07" opacity="0.85">
    <ellipse cx="620" cy="415" rx="38" ry="26"/>
    <ellipse cx="590" cy="403" rx="21" ry="18"/>
    <path d="M578 414 Q564 428 573 441 Q576 446 580 443 Q574 431 579 423 Q585 417 590 410" fill="#0a1204"/>
    <rect x="600" y="435" width="10" height="28" rx="4" fill="#0a1004"/>
    <rect x="616" y="436" width="10" height="26" rx="4" fill="#0a1004"/>
    <rect x="632" y="435" width="10" height="28" rx="4" fill="#0a1004"/>
    <rect x="648" y="436" width="9" height="27" rx="4" fill="#0a1004"/>
  </g>

  <!-- Foreground acacia -->
  <rect x="695" y="330" width="5" height="100" fill="#0a1204"/>
  <path d="M665 330 Q696 290 720 308 Q738 280 760 298 Q780 270 798 290 Q790 308 770 300 Q755 320 738 308 Q720 328 705 315 Q690 335 665 330Z" fill="#0f2208"/>

  <!-- Foreground grass tufts -->
  <path d="M30 440 L25 415 M38 440 L42 412 M50 440 L46 418" stroke="#1a3a08" stroke-width="2" opacity="0.6"/>
  <path d="M130 445 L126 420 M138 445 L142 418 M150 445 L146 422" stroke="#1a3a08" stroke-width="2" opacity="0.5"/>
  <path d="M680 442 L676 418 M688 442 L692 415 M700 442 L696 420" stroke="#1a3a08" stroke-width="2" opacity="0.6"/>

  <!-- Atmosphere tint -->
  <rect width="800" height="500" fill="#f97316" opacity="0.03"/>
</svg>