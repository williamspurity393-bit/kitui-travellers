<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0e04"/>
      <stop offset="40%" stop-color="#1a2a08"/>
      <stop offset="70%" stop-color="#2d4a10"/>
      <stop offset="100%" stop-color="#3d6018"/>
    </linearGradient>
    <linearGradient id="savanna" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a7020"/>
      <stop offset="100%" stop-color="#1a2a08"/>
    </linearGradient>
    <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8b7a20"/>
      <stop offset="100%" stop-color="#4a4010"/>
    </linearGradient>
    <radialGradient id="moon-glow" cx="20%" cy="15%" r="20%">
      <stop offset="0%" stop-color="#c8e0a0" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <filter id="blur-trees">
      <feGaussianBlur stdDeviation="1.5"/>
    </filter>
  </defs>

  <!-- Sky - deep night -->
  <rect width="800" height="500" fill="url(#sky)"/>
  <!-- Moon glow -->
  <circle cx="160" cy="75" r="50" fill="#c8e0a0" opacity="0.1"/>
  <circle cx="160" cy="75" r="28" fill="#d8eab0" opacity="0.8"/>
  <circle cx="163" cy="72" r="22" fill="#e8f4c0"/>
  <!-- Moon craters hint -->
  <circle cx="155" cy="68" r="5" fill="#d0e8a0" opacity="0.5"/>
  <circle cx="168" cy="80" r="3" fill="#d0e8a0" opacity="0.4"/>

  <!-- Stars -->
  <circle cx="320" cy="35" r="1.2" fill="white" opacity="0.8"/>
  <circle cx="450" cy="20" r="0.9" fill="white" opacity="0.7"/>
  <circle cx="580" cy="45" r="1.1" fill="white" opacity="0.6"/>
  <circle cx="680" cy="28" r="1.3" fill="white" opacity="0.9"/>
  <circle cx="750" cy="55" r="0.8" fill="white" opacity="0.6"/>
  <circle cx="520" cy="60" r="1" fill="white" opacity="0.7"/>
  <circle cx="250" cy="50" r="0.9" fill="white" opacity="0.5"/>

  <!-- Distant treeline -->
  <path d="M0 300 Q50 260 110 275 Q160 255 220 268 Q280 248 350 262 Q420 245 490 258 Q550 242 620 256 Q690 240 760 254 L800 258 L800 320 L0 320Z" fill="#0a1804" opacity="0.95"/>

  <!-- MAIN ACACIA TREE - dramatic, centre-left -->
  <rect x="238" y="180" width="8" height="220" fill="#1a1004"/>
  <!-- Main branches -->
  <line x1="242" y1="200" x2="160" y2="160" stroke="#1a1004" stroke-width="6"/>
  <line x1="242" y1="220" x2="340" y2="170" stroke="#1a1004" stroke-width="5"/>
  <line x1="242" y1="240" x2="180" y2="220" stroke="#1a1004" stroke-width="4"/>
  <line x1="242" y1="250" x2="310" y2="230" stroke="#1a1004" stroke-width="3.5"/>
  <!-- Sub-branches -->
  <line x1="160" y1="160" x2="120" y2="140" stroke="#1a1004" stroke-width="3"/>
  <line x1="160" y1="160" x2="175" y2="138" stroke="#1a1004" stroke-width="2.5"/>
  <line x1="340" y1="170" x2="368" y2="148" stroke="#1a1004" stroke-width="3"/>
  <line x1="340" y1="170" x2="322" y2="148" stroke="#1a1004" stroke-width="2.5"/>
  <!-- Foliage canopy -->
  <ellipse cx="165" cy="138" rx="52" ry="28" fill="#1e3808" opacity="0.9"/>
  <ellipse cx="145" cy="130" rx="38" ry="22" fill="#244510" opacity="0.85"/>
  <ellipse cx="185" cy="128" rx="42" ry="24" fill="#1a3808" opacity="0.8"/>
  <ellipse cx="360" cy="148" rx="48" ry="26" fill="#1e3808" opacity="0.9"/>
  <ellipse cx="340" cy="140" rx="36" ry="20" fill="#244510" opacity="0.85"/>
  <ellipse cx="380" cy="142" rx="40" ry="22" fill="#1a3808" opacity="0.8"/>
  <ellipse cx="190" cy="218" rx="40" ry="20" fill="#1e3808" opacity="0.85"/>
  <ellipse cx="315" cy="228" rx="36" ry="18" fill="#1e3808" opacity="0.8"/>

  <!-- LEOPARD on branch -->
  <!-- Branch the leopard is on -->
  <line x1="242" y1="220" x2="340" y2="195" stroke="#1a1004" stroke-width="5"/>
  <!-- Leopard body -->
  <ellipse cx="295" cy="208" rx="36" ry="11" fill="#c8944a" opacity="0.92"/>
  <!-- Head -->
  <circle cx="266" cy="204" r="12" fill="#c8944a" opacity="0.92"/>
  <!-- Ears -->
  <path d="M261 194 L257 186 L266 190Z" fill="#c8944a"/>
  <path d="M271 192 L276 185 L280 190Z" fill="#c8944a"/>
  <!-- Face markings -->
  <circle cx="262" cy="202" r="2.5" fill="#0a0804" opacity="0.8"/>
  <circle cx="271" cy="202" r="2.5" fill="#0a0804" opacity="0.8"/>
  <!-- Eye shine -->
  <circle cx="262" cy="202" r="1" fill="#fde68a" opacity="0.7"/>
  <circle cx="271" cy="202" r="1" fill="#fde68a" opacity="0.7"/>
  <!-- Nose -->
  <path d="M264 207 Q266.5 210 269 207" stroke="#8b4010" stroke-width="1.5" fill="none"/>
  <!-- Spots on body -->
  <circle cx="285" cy="205" r="3.5" fill="#8b6020" opacity="0.7"/>
  <circle cx="300" cy="208" r="3" fill="#8b6020" opacity="0.7"/>
  <circle cx="315" cy="206" r="3.5" fill="#8b6020" opacity="0.7"/>
  <circle cx="278" cy="212" r="2.5" fill="#8b6020" opacity="0.6"/>
  <circle cx="293" cy="215" r="2.5" fill="#8b6020" opacity="0.6"/>
  <circle cx="310" cy="213" r="2.5" fill="#8b6020" opacity="0.6"/>
  <!-- Dangling tail -->
  <path d="M328 208 Q340 220 338 238 Q336 255 342 265" stroke="#c8944a" stroke-width="5" fill="none" stroke-linecap="round"/>
  <circle cx="342" cy="268" r="4" fill="#c8944a"/>
  <!-- Dangling paws -->
  <path d="M272 215 L268 230 Q264 235 260 230" stroke="#c8944a" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M282 215 L280 232 Q276 237 272 232" stroke="#c8944a" stroke-width="4" fill="none" stroke-linecap="round"/>

  <!-- Right acacia - smaller -->
  <rect x="600" y="240" width="5" height="160" fill="#1a1004"/>
  <line x1="602" y1="260" x2="545" y2="232" stroke="#1a1004" stroke-width="4"/>
  <line x1="602" y1="278" x2="658" y2="250" stroke="#1a1004" stroke-width="3.5"/>
  <ellipse cx="540" cy="224" rx="42" ry="22" fill="#1e3808" opacity="0.9"/>
  <ellipse cx="660" cy="242" rx="38" ry="20" fill="#1e3808" opacity="0.88"/>

  <!-- Savanna ground -->
  <path d="M0 360 Q400 342 800 358 L800 500 L0 500Z" fill="#1a2808"/>

  <!-- Tall grass in foreground -->
  <g opacity="0.8">
    <!-- Left grasses -->
    <path d="M30 420 L25 375 M38 420 L40 370 M48 422 L52 378 M58 420 L54 372 M68 422 L72 380" stroke="#6a7820" stroke-width="2.5" fill="none"/>
    <path d="M35 420 L28 382 M44 420 L48 374 M54 422 L58 380 M64 420 L60 376" stroke="#8b9a28" stroke-width="1.5" fill="none"/>
    <!-- Right grasses -->
    <path d="M720 418 L716 374 M730 420 L734 372 M742 418 L746 376 M754 420 L750 374 M765 418 L769 380" stroke="#6a7820" stroke-width="2.5" fill="none"/>
    <path d="M726 420 L720 380 M738 418 L742 374 M750 420 L754 378 M760 418 L756 374" stroke="#8b9a28" stroke-width="1.5" fill="none"/>
    <!-- Center grasses scattered -->
    <path d="M440 425 L436 385 M450 425 L454 382 M462 425 L466 386" stroke="#6a7820" stroke-width="2" fill="none"/>
  </g>

  <!-- Ground shadow under tree -->
  <ellipse cx="242" cy="400" rx="80" ry="20" fill="#0a0e04" opacity="0.5"/>

  <!-- Atmospheric green tint -->
  <rect width="800" height="500" fill="#34d399" opacity="0.02"/>
</svg>